# git フックの設定（https://lefthook.dev）。`pnpm install` の prepare で `lefthook install` が実行される。
# lefthook・gitleaks などのツールは mise で入れる。
min_version: "2.1.0"

pre-commit:
  jobs:
    # 1. 整形して、整形した結果を stage し直す。
    - name: format
      group:
        piped: true
        jobs:
          - name: rustfmt
            glob: "*.rs"
            run: cargo fmt --all
            stage_fixed: true
          - name: taplo
            glob: "*.toml"
            run: taplo fmt {staged_files}
            stage_fixed: true
          - name: rumdl
            glob: "*.md"
            exclude:
              - ".claude/skills/**"
              - "CLAUDE.md"
            run: rumdl fmt {staged_files}
            stage_fixed: true

    # 2. 静的解析。
    - name: lint
      group:
        parallel: true
        jobs:
          - name: clippy
            glob: "*.rs"
            run: cargo clippy --workspace --target wasm32-unknown-unknown --locked -- -D warnings
          - name: rumdl
            glob: "*.md"
            exclude:
              - ".claude/skills/**"
              - "CLAUDE.md"
            run: rumdl check {staged_files}
          - name: github-actions
            glob: ".github/**/*.{yml,yaml}"
            run: actionlint && ghalint run && zizmor --offline .github
          - name: shellcheck
            glob: "*.sh"
            run: shellcheck {staged_files}
          # JavaScript とテストの型（tsconfig.json・scripts/tsconfig.json）。型はファイルをまたぐので、全体を確かめる。
          - name: tsc
            glob:
              - "*.{js,mjs,ts}"
              - "tsconfig.json"
              # 型の定義（typescript・vitest・happy-dom）の版を上げたときにも確かめる（入れてある node_modules で確かめるので、先に pnpm install する）。
              - "package.json"
              - "pnpm-lock.yaml"
            run: pnpm exec tsc -p tsconfig.json && pnpm exec tsc -p scripts/tsconfig.json

    # 3. 秘密情報が stage されていないかを調べる。
    - name: gitleaks
      run: gitleaks git --staged --no-banner --redact

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
