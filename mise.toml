[settings]
# 公開から 7 日たっていない版を選ばない（サプライチェーン攻撃の対策）。
minimum_release_age = "7d"
# mise.lock に記録した版とチェックサムのとおりにだけ入れる。
lockfile = true
locked = true

[tools]
rust = { version = "1.99", components = "rustfmt,clippy,rust-analyzer", targets = "wasm32-unknown-unknown", profile = "minimal" }
node = "26"
pnpm = "12"
# ビルドに OS の pkg-config と libssl-dev が要る（README.md の「開発の始め方」）。
"cargo:worker-build" = "0.8.7"
lefthook = "2"
gitleaks = "8"
taplo = "0.10"
actionlint = "1"
# actionlint が workflow の run: のシェルスクリプトを調べるのに使う。
shellcheck = "0.11"
zizmor = "1"
cargo-deny = "0.20"
rumdl = "0.3"
ghalint = "1"
# GitHub Actions の workflow lockfile を作る・確かめる gh の拡張機能。
"github:github/gh-actions-lock" = { version = "0.4.1", bin = "gh-actions-lock" }

# よく使う作業。`mise run <名前>` で実行する。CI も同じタスクを使う。
[tasks.fmt]
description = "Rust・TOML・Markdown を整形する"
run = ["cargo fmt --all", "taplo fmt", "rumdl fmt ."]

[tasks.lint]
description = "整形の確認と静的解析をまとめて実行する"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --target wasm32-unknown-unknown --locked -- -D warnings",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "taplo fmt --check",
  "rumdl check .",
  "actionlint",
  "ghalint run",
  "zizmor --offline .github",
  "shellcheck scripts/*.sh",
]

[tasks.audit]
description = "依存の脆弱性・ライセンス・取得元・署名を調べる"
run = ["cargo deny --locked check", "pnpm audit signatures"]

[tasks.test]
description = "Rust のテストを実行する"
run = "cargo test --workspace --locked"

[tasks.build]
description = "Worker をビルドする"
dir = "apps/recipe-box-rs"
# worker-build は --locked を受け取らないので、先に Cargo.lock が最新かを確かめる。
run = ["cargo fetch --locked", "worker-build --release"]

[tasks.migrate]
description = "ローカルの D1 にマイグレーションを当てる"
dir = "apps/recipe-box-rs"
run = "pnpm exec wrangler d1 migrations apply DB --local"

[tasks.smoke]
description = "起動中のローカルの Worker に API を呼んで確かめる（先に別の端末で mise run dev）"
run = "scripts/smoke-test.sh"

[tasks.dev]
description = "ローカルの D1 にマイグレーションを当て、Worker を起動する（http://localhost:8787）"
dir = "apps/recipe-box-rs"
depends = ["migrate"]
run = "pnpm exec wrangler dev"
