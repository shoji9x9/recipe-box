[settings]
# 公開から 7 日たっていない版を選ばない（サプライチェーン攻撃の対策）。
minimum_release_age = "7d"
# mise.lock に記録した版とチェックサムのとおりにだけ入れる。
lockfile = true
locked = true

[tools]
rust = { version = "1.100", components = "rustfmt,clippy,rust-analyzer", targets = "wasm32-unknown-unknown", profile = "minimal" }
node = "26"
pnpm = "12"
# ビルドに OS の pkg-config と libssl-dev が要る（docs/development.md の「開発の始め方」）。
"cargo:worker-build" = "0.8.7"
lefthook = "2"
gitleaks = "8"
taplo = "0.10"
actionlint = "1"
# actionlint が workflow の run: のシェルスクリプトを調べるのに使う。
shellcheck = "0.11"
zizmor = "1"
cargo-deny = "0.20"
rumdl = "0.3"
ghalint = "1"
# GitHub Actions の workflow lockfile を作る・確かめる gh の拡張機能。
"github:github/gh-actions-lock" = { version = "0.4.1", bin = "gh-actions-lock" }
# 解説（/about）の図を、テキストの元（guide/*.d2）から SVG にする（mise run guide）。
d2 = "0.9"

# よく使う作業。`mise run <名前>` で実行する。CI も同じタスクを使う。
[tasks.fmt]
description = "Rust・TOML・Markdown を整形する"
run = ["cargo fmt --all", "taplo fmt", "rumdl fmt ."]

[tasks.lint]
description = "整形の確認と静的解析をまとめて実行する"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --target wasm32-unknown-unknown --locked -- -D warnings",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "taplo fmt --check",
  "rumdl check .",
  "actionlint",
  "ghalint run",
  "zizmor --offline .github",
  "shellcheck scripts/*.sh",
  # JavaScript とテストの型（mise run typecheck）。
  { task = "typecheck" },
  # modern-web-guidance のスキルとパッケージの版がそろっているか（AGENTS.md の「スキル」）。
  "scripts/check-mwg-version.sh",
  # アプリの解説（/about）が、元の文章と引用するファイルから作り直したものと同じか（mise run guide）。
  "node scripts/guide.ts --check",
]

[tasks.typecheck]
description = "JavaScript と TypeScript の型を確かめる（lint と、commit の前の lefthook から呼ぶ）"
# 画面と Worker の JavaScript（JSDoc の型）とそのテストは tsconfig.json（DOM の型）、スクリプトとそのテストは scripts/tsconfig.json（Node の型）。
run = [
  "pnpm exec tsc -p tsconfig.json",
  "pnpm exec tsc -p scripts/tsconfig.json",
]

[tasks.audit]
description = "依存の脆弱性・ライセンス・取得元・署名を調べる"
run = ["cargo deny --locked check", "pnpm audit signatures"]

[tasks.test]
description = "Rust のテストと、JavaScript の単体テスト（画面と Worker の JavaScript と、seed・pin・自動削除の確かめ（check-cleanup）・解説（guide）・アプリの規模（size）・modern-web-guidance のスクリプト）を実行する"
run = [
  "cargo test --workspace --locked",
  # 画面（apps/*/js-tests/）と Worker（apps/*/js-tests/worker/）とスクリプト（scripts/*.test.ts）。vitest.config.ts。
  "pnpm exec vitest run",
]

[tasks.build]
description = "Worker をビルドする"
dir = "apps/recipe-box-rs"
# worker-build は --locked を受け取らないので、先に Cargo.lock が最新かを確かめる。
# htmx のコピーは wrangler.toml の [build] の command と同じにする。
run = [
  "cargo fetch --locked",
  "worker-build --release",
  "mkdir -p public/assets",
  "cp ../../node_modules/htmx.org/dist/htmx.min.js public/assets/htmx.min.js",
]

[tasks.migrate]
description = "ローカルの D1 にマイグレーションを当てる"
dir = "apps/recipe-box-rs"
run = "pnpm exec wrangler d1 migrations apply DB --local"

[tasks.smoke]
description = "起動中のローカルの Worker に API を呼んで確かめる（先に別の端末で mise run dev）"
run = "node scripts/smoke-test.ts"

[tasks.pin]
description = "ワークスペースに、自動削除と削除から外す印を付ける（管理用。ID は標準入力で渡す。例: mise run pin -- --remote < <ID のファイル>）"
run = "node scripts/pin-workspace.ts"

[tasks.check-cleanup]
description = "定期の自動削除が 3 時間以内に成功し、消し終えているはずのものが残っていないかを、D1 で確かめる（例: mise run check-cleanup -- --local）"
run = "node scripts/check-cleanup.ts"

[tasks.guide]
description = "アプリの解説（/about）を、guide/ の元の文章と図から作り直す"
run = "node scripts/guide.ts"

[tasks.size]
description = "アプリの規模（ファイル数と行数）を commit で数え、解説の元（guide/about.md）の表を書き換える（例: mise run size -- --ref origin/main）"
# 数は commit のたびに変わるので、mise run lint は確かめない（docs/development.md の「解説（/about）」）。
run = "node scripts/size.ts"

[tasks.seed]
description = "共有のデモを、サンプルのレシピと写真の状態に戻す（ID は標準入力で渡す。例: mise run seed -- --remote < <ID のファイル>）"
run = "node scripts/seed.ts"

[tasks.dev]
description = "ローカルの D1 にマイグレーションを当て、Worker を起動する（http://localhost:8787）"
dir = "apps/recipe-box-rs"
depends = ["migrate"]
run = "pnpm exec wrangler dev"

[tasks.mwg]
description = "Web の作り方の指針（modern-web-guidance）を引く。例: mise run mwg -- search \"<検索の語>\""
# 固定した版を、利用統計を送らずに、読むだけのサブコマンドで使う（scripts/mwg.sh・AGENTS.md の「スキル」）。
run = "scripts/mwg.sh"
