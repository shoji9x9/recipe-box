[workspace]
resolver = "3"
members = ["apps/recipe-box-rs"]

# Workers へ送る wasm を小さくする。
# strip は使わない。strip = true は、wasm-bindgen が Wasm の機能を調べる target_features の節まで消し、
# ビルドが警告を出す。wasm-bindgen の後の小さくする処理は、worker-build が wasm-opt で行う。
# worker-build は、wasm-opt に name の節（関数の名前）を残させる。そのため、strip = true より wasm は
# 大きくなる（gzip で 1 割ほど）が、Workers の上限には十分に余裕がある。
[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# 一般的な指摘に加えて、細かい書き方の指摘も受ける。
pedantic = { level = "warn", priority = -1 }
