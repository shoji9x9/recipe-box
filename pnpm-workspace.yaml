# pnpm の設定。Node のパッケージは、wrangler・commitlint・chrome-devtools-mcp・htmx・modern-web-guidance と、JavaScript のテストと型の確認（vitest・happy-dom・TypeScript・Node と commitlint の型）のためだけに使う。

# 公開から 7 日（10080 分）たっていない版を入れない。条件に合う版が無ければ失敗する。
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true

# 以前の版より信頼の根拠（provenance など）が弱くなった版を入れない。
trustPolicy: no-downgrade

# インストール時のスクリプトは、ここで許可したパッケージだけ実行する。
allowBuilds:
  # 各 OS 用のバイナリが正しく入ったかを確かめるスクリプト。
  esbuild: true
  workerd: true
