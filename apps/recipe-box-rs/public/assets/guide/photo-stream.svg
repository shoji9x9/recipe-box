="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3721991688-3488378134)" mask="url(#d2-3721991688)" /><text x="790" y="946" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">FixedLengthStream の読む側</text></g><g class="KHJ1c3QgLSZndDsgcjIpWzBd"><path d="M 1063.5 1030.5 L 1501 1030.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3721991688-3488378134)" mask="url(#d2-3721991688)" /><text x="1283" y="1036" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">put（読む側をそのまま渡す）</text></g><g class="KGpzIC0mZ3Q7IHIyKVswXQ=="><path d="M 521 1120.5 L 1501 1120.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3721991688-3488378134)" mask="url(#d2-3721991688)" /><text x="1012.5" y="1126" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">書き換えた頭と、読みすぎた分を書く</text></g><g class="KHJ1bnRpbWUgLSZndDsgcjIpWzBd"><path d="M 183.5 1218.5 L 1501 1218.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3721991688-3488378134)" mask="url(#d2-3721991688)" /><text x="843.5" y="1216" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="843.5" dy="0">本文の残りを pipeTo で流す</tspan><tspan x="843.5" dy="18.5">（JavaScript の関数も Wasm も通らない）</tspan></text></g><g class="KHIyIC0mZ3Q7IHJ1c3QpWzBd"><path d="M 1503 1316.5 L 1065.5 1316.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3721991688-3488378134)" mask="url(#d2-3721991688)" /><text x="1283" y="1322" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">書けた</text></g><mask id="d2-3721991688" maskUnits="userSpaceOnUse" x="-5" y="35" width="1577" height="1369">
