Z3Q7IHJ1c3QpWzBd result"><marker id="mk-d2-2239014255-2789088195" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#6a6a6a" class="connection" stroke-width="2" /> </marker><path d="M 422 470 L 785.5 470" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-2239014255-2789088195)" mask="url(#d2-2239014255)" /><text x="605" y="468" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="605" dy="0">最初の部分だけを返す</tspan><tspan x="605" dy="18.5">（残りは Rust に渡さない）</tspan></text></g><g class="KHJ1c3QgLSZndDsgcnVzdClbMF0= key"><marker id="mk-d2-2239014255-3197826725" markerWidth="13" markerHeight="16" refX="8.5" refY="8" viewBox="0 0 13 16" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 13,8 0,16" fill="#e00b41" class="connection" stroke-width="3" /> </marker><path d="M 792 558 L 955 558 S 965 558 965 568 L 965 603.5 S 965 613.5 955 613.5 L 795 613.5" stroke="#e00b41" fill="none" class="connection" style="stroke-width:3;" marker-end="url(#mk-d2-2239014255-3197826725)" mask="url(#d2-2239014255)" /><text x="965.5" y="583" fill="#e00b41" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="965.5" dy="0">metadata.rs が、先頭の位置情報などを</tspan><tspan x="965.5" dy="18.5">0 で埋める</tspan></text></g><g class="KHJ1c3QgLSZndDsganMpWzFd"><path d="M 787.5 709.5 L 424 709.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2239014255-3488378134)" mask="url(#d2-2239014255)" /><text x="604.5" y="699" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="604.5" dy="0">書き換えた最初の部分だけを渡し、</tspan><tspan x="604.5" dy="17.666667">R2 へ流すストリームを作るよう指示</tspan><tspan x="604.5" dy="17.666667">（joinPhoto）</tspan></text></g><g class="KGpzIC0mZ3Q7IHJ1c3QpWzFd result"><path d="M 422 823.5 L 785.5 823.5" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-2239014255-2789088195)" mask="url(#d2-2239014255)" /><text x="605" y="821" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="605" dy="0">R2 に渡すストリームを返す</tspan><tspan x="605" dy="18.5">（まだ何も流れていない）</tspan></text></g><g class="KHJ1c3QgLSZndDsgcjIpWzBd"><path d="M 791.5 921.5 L 1195 921.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2239014255-3488378134)" mask="url(#d2-2239014255)" /><text x="994" y="927" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">ストリームを渡して書くよう指示（put）</text></g><g class="KHJ1bnRpbWUgLSZndDsgcjIpWzBd key"><path d="M 134.5 1027.5 L 1193.5 1027.5" stroke="#e00b41" fill="none" class="connection" style="stroke-width:3;" marker-end="url(#mk-d2-2239014255-3197826725)" mask="url(#d2-2239014255)" /><text x="666" y="1017" fill="#e00b41" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="666" dy="0">本文の残りを pipeTo で流す</tspan><tspan x="666" dy="17.666667">（最初の部分と読みすぎた分を書き終えると</tspan><tspan x="666" dy="17.666667">自動で始まる。JavaScript の関数も Wasm も通らない）</tspan></text></g><g class="KHIyIC0mZ3Q7IHJ1c3QpWzBd result"><path d="M 1197 1141.5 L 793.5 1141.5" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-2239014255-2789088195)" mask="url(#d2-2239014255)" /><text x="994" y="1139" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="994" dy="0">完了通知</tspan><tspan x="994" dy="18.5">（R2 への書き込みが終わった）</tspan></text></g><mask id="d2-2239014255" maskUnits="userSpaceOnUse" x="-5" y="35" width="1271" height="1194">
