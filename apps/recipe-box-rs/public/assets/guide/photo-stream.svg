chor:middle;font-size:16px">R2</text></g><g class="KHJ1bnRpbWUgLS0gKVswXQ=="><path d="M 132 172 L 132 2013" stroke="#f38020" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-2533685383)" /></g><g class="KGpzIC0tIClbMF0="><path d="M 420 172 L 420 2013" stroke="#e00b41" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-2533685383)" /></g><g class="KHJ1c3QgLS0gKVswXQ=="><path d="M 711.5 172 L 711.5 2013" stroke="#e00b41" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-2533685383)" /></g><g class="KHIyIC0tIClbMF0="><path d="M 1087 172 L 1087 2013" stroke="#2b6cb0" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-2533685383)" /></g><g class="KHJ1bnRpbWUgLSZndDsgcnVzdClbMF0="><marker id="mk-d2-2533685383-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#6a6a6a" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 134 250 L 707.5 250" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="422" y="256" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">リクエストを渡す（本文はまだ読まない）</text></g><g class="KHJ1c3QgLSZndDsganMpWzBd"><path d="M 709.5 348 L 424 348" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="565.5" y="346" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="565.5" dy="0">readAtLeast を呼ぶ</tspan><tspan x="565.5" dy="18.5">（本文を 64 KiB 読んで）</tspan></text></g><g class="KGpzIC0mZ3Q7IHJ1bnRpbWUpWzBd"><path d="M 418 446 L 136 446" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="276" y="452" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">reader.read() を呼ぶ</text></g><g class="KHJ1bnRpbWUgLSZndDsganMpWzBd"><marker id="mk-d2-2533685383-2789088195" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#6a6a6a" class="connection" stroke-width="2" /> </marker><path d="M 134 536 L 416 536" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-2533685383-2789088195)" mask="url(#d2-2533685383)" /><text x="276.5" y="542" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">本文の続き（数 KiB ずつ）</text></g><g class="KGpzIC0mZ3Q7IGpzKVswXQ=="><path d="M 422 616 L 513.5 616 S 523.5 616 523.5 626 L 523.5 661.5 S 523.5 671.5 513.5 671.5 L 424 671.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="523.5" y="641" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="523.5" dy="0">64 KiB になるまで、</tspan><tspan x="523.5" dy="18.5">reader.read() を繰り返す</tspan></text></g><g class="KGpzIC0mZ3Q7IHJ1c3QpWzBd"><path d="M 422 759.5 L 707.5 759.5" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-2533685383-2789088195)" mask="url(#d2-2533685383)" /><text x="565.5" y="757" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="565.5" dy="0">読んだバイト列</tspan><tspan x="565.5" dy="18.5">（Rust のメモリーに写る）</tspan></text></g><g class="KHJ1c3QgLSZndDsgcnVzdClbMF0="><path d="M 713.5 847.5 L 879.5 847.5 S 889.5 847.5 889.5 857.5 L 889.5 893 S 889.5 903 879.5 903 L 715.5 903" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="890" y="873" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="890" dy="0">先頭が終わるまで読めたか確かめる</tspan><tspan x="890" dy="18.5">（足りなければ readAtLeast をもう一度）</tspan></text></g><g class="KHJ1c3QgLSZndDsgcnVzdClbMV0="><path d="M 713.5 973 L 869 973 S 879 973 879 983 L 879 1018.5 S 879 1028.5 869 1028.5 L 715.5 1028.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="879.5" y="998" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="879.5" dy="0">metadata.rs が、先頭の位置情報などを</tspan><tspan x="879.5" dy="18.5">0 で埋める</tspan></text></g><g class="KHJ1c3QgLSZndDsgcnVzdClbMl0="><path d="M 713.5 1098.5 L 846.5 1098.5 S 856.5 1098.5 856.5 1108.5 L 856.5 1144 S 856.5 1154 846.5 1154 L 715.5 1154" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="857" y="1124" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="857" dy="0">D1 に行を入れる</tspan><tspan x="857" dy="18.5">（順序は「写真の保管」の図）</tspan></text></g><g class="KHJ1c3QgLSZndDsganMpWzFd"><path d="M 709.5 1242 L 424 1242" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="565.5" y="1240" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="565.5" dy="0">joinPhoto を呼ぶ</tspan><tspan x="565.5" dy="18.5">（書き換えた先頭を渡す）</tspan></text></g><g class="KGpzIC0mZ3Q7IHJ1c3QpWzFd"><path d="M 422 1348 L 707.5 1348" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-2533685383-2789088195)" mask="url(#d2-2533685383)" /><text x="565.5" y="1346" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="565.5" dy="0">R2 に渡すストリーム</tspan><tspan x="565.5" dy="18.5">（まだ何も流れていない）</tspan></text></g><g class="KHJ1c3QgLSZndDsgcjIpWzBd"><path d="M 713.5 1446 L 1083 1446" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="899.5" y="1452" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">put を呼ぶ（そのストリームを渡す）</text></g><g class="KHIyIC0mZ3Q7IGpzKVswXQ=="><path d="M 1085 1536 L 424 1536" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="754" y="1542" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">ストリームを読み始める</text></g><g class="KGpzIC0mZ3Q7IHIyKVswXQ=="><path d="M 422 1634 L 1083 1634" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="753.5" y="1632" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="753.5" dy="0">書き換えた先頭と、</tspan><tspan x="753.5" dy="18.5">読みすぎた分が流れる</tspan></text></g><g class="KGpzIC0mZ3Q7IHJ1bnRpbWUpWzFd"><path d="M 418 1740 L 136 1740" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="276.5" y="1738" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="276.5" dy="0">書き終えたら</tspan><tspan x="276.5" dy="18.5">pipeTo を始める</tspan></text></g><g class="KHJ1bnRpbWUgLSZndDsgcjIpWzBd"><path d="M 134 1846 L 1083 1846" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-2533685383-3488378134)" mask="url(#d2-2533685383)" /><text x="610" y="1844" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="610" dy="0">本文の残りが、そのまま流れる</tspan><tspan x="610" dy="18.5">（JavaScript も Rust も通らない）</tspan></text></g><g class="KHIyIC0mZ3Q7IHJ1c3QpWzBd"><path d="M 1085 1944 L 715.5 1944" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-2533685383-2789088195)" mask="url(#d2-2533685383)" /><text x="899.5" y="1950" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">書けた（put が終わる）</text></g><mask id="d2-2533685383" maskUnits="userSpaceOnUse" x="-5" y="35" width="1159" height="1996">
