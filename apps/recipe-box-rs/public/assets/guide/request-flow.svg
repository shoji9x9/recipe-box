text></g><g class="cm91dGVy decision"><g class="shape" ><path d="M 1028 784 C 1026 784 1025 784 1024 783 L 814 708 C 812 707 812 706 814 705 L 1024 629 C 1026 628 1030 628 1032 629 L 1242 705 C 1244 706 1244 707 1242 708 L 1032 783 C 1031 784 1030 784 1028 784 Z" stroke="#6b46c1" fill="#f4f1ff" style="stroke-width:2;" /></g><text x="1028" y="695.5" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1028" dy="0">パスとメソッドに合う</tspan><tspan x="1028" dy="17.666667">ルートか？</tspan><tspan x="1028" dy="17.666667">（axum の Router）</tspan></text></g><g class="bXc= decision"><g class="shape" ><path d="M 828 1175 C 825 1175 823 1175 821 1174 L 470 1067 C 466 1066 466 1064 470 1063 L 821 956 C 825 955 830 955 834 956 L 1186 1063 C 1190 1064 1190 1066 1186 1067 L 835 1174 C 833 1175 831 1175 828 1175 Z" stroke="#6b46c1" fill="#f4f1ff" style="stroke-width:2;" /></g><text x="828" y="1038.5" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="828" dy="0">回数・大きさ・送り元は</tspan><tspan x="828" dy="17">許す範囲か？（middleware）</tspan><tspan x="828" dy="17">書き込みの回数（IP アドレスごと）</tspan><tspan x="828" dy="17">本文の大きさ</tspan><tspan x="828" dy="17">送り元（Origin。画面の書き込みだけ）</tspan></text></g><g class="bmVlZHNfd3M= decision"><g class="shape" ><path d="M 560 1502 C 558 1502 557 1502 556 1501 L 326 1426 C 324 1425 324 1424 326 1423 L 556 1347 C 558 1346 562 1346 565 1347 L 795 1423 C 797 1424 797 1425 795 1426 L 564 1501 C 563 1502 562 1502 560 1502 Z" stroke="#6b46c1" fill="#f4f1ff" style="stroke-width:2;" /></g><text x="560" y="1413.5" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="560" dy="0">ワークスペースを</tspan><tspan x="560" dy="17.666667">使うルートか？</tspan><tspan x="560" dy="17.666667">（作成などは使わない）</tspan></text></g><g class="d3M= decision"><g class="shape" ><path d="M 793 1829 C 790 1829 788 1829 786 1828 L 418 1753 C 414 1752 414 1751 418 1750 L 786 1674 C 790 1673 796 1673 800 1674 L 1168 1750 C 1172 1751 1172 1752 1168 1753 L 800 1828 C 798 1829 796 1829 793 1829 Z" stroke="#6b46c1" fill="#f4f1ff" style="stroke-width:2;" /></g><text x="793" y="1740.5" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="793" dy="0">使うワークスペースは在るか？</tspan><tspan x="793" dy="17.666667">API: X-Workspace-Id の ID（extractor）</tspan><tspan x="793" dy="17.666667">画面: Cookie の ID か、無ければ共有のデモ</tspan></text></g><g class="c3RhcnQ= terminal"><g class="shape" ><ellipse rx="188" ry="62.5" cx="1055" cy="2072.5" stroke="#6a6a6a" fill="#f7f7f7" class="shape" style="stroke-width:2;" /></g><text x="1055" y="2070" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="1055" dy="0">「はじめる」画面へ移す</tspan><tspan x="1055" dy="18.5">（一覧はその場で出す）</tspan></text></g><g class="Y2hlY2s= decision"><g class="shape" ><path d="M 421 2166 C 418 2166 416 2166 415 2165 L 67 2090 C 63 2089 63 2088 67 2087 L 415 2011 C 419 2010 424 2010 428 2011 L 776 2087 C 780 2088 780 2089 776 2090 L 427 2165 C 426 2166 424 2166 421 2166 Z" stroke="#6b46c1" fill="#f4f1ff" style="stroke-width:2;" /></g><text x="421" y="2077.5" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="421" dy="0">入力は正しいか？</tspan><tspan x="421" dy="17.666667">形と長さ・写真の形式・デモでの禁止</tspan><tspan x="421" dy="17.666667">（D1 も R2 も使わない確かめ）</tspan></text></g><g class="d29yaw== app"><g class="shape" ><rect x="12" y="2337" width="450" height="82" rx="8" stroke="#e00b41" fill="#fff0f3" style="stroke-width:2;" /></g><text x="237" y="2375.5" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="237" dy="0">Backend を通して D1・R2 などを使う</tspan><tspan x="237" dy="18.5">上限は、D1 に書くときに同じ文の中で数える</tspan></text></g><g class="b2s= decision"><g class="shape" ><path d="M 237 2581 C 236 2581 235 2581 234 2581 L 63 2536 C 61 2536 61 2535 63 2534 L 234 2489 C 236 2489 239 2489 240 2489 L 410 2534 C 412 2534 412 2535 410 2536 L 240 2581 C 239 2581 238 2581 237 2581 Z" stroke="#6b46c1" fill="#f4f1ff" style="stroke-width:2;" /></g><text x="237" y="2540.5" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px">うまくいったか？</text></g><g class="cmVz terminal"><g class="shape" ><ellipse rx="133" ry="44.5" cx="149" cy="2856.5" stroke="#6a6a6a" fill="#f7f7f7" class="shape" style="stroke-width:2;" /></g><text x="149" y="2854" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px"><tspan x="149" dy="0">応答を返す</tspan><tspan x="149" dy="18.5">（HTML か JSON）</tspan></text></g><g class="cmVqZWN0 terminal"><g class="shape" ><ellipse rx="130.5" ry="43.5" cx="825.5" cy="2855.5" stroke="#6a6a6a" fill="#f7f7f7" class="shape" style="stroke-width:2;" /></g><text x="825.5" y="2861" fill="#222222" class="text-bold" style="text-anchor:middle;font-size:16px">断る応答を返す</text></g><g class="KHJlcSAtJmd0OyBhc3NldHMpWzBd"><marker id="mk-d2-1168463733-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#6a6a6a" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 791 82 L 791 145" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1168463733-3488378134)" mask="url(#d2-1168463733)" /></g><g class="KGFzc2V0cyAtJmd0OyBmaWxlKVswXQ=="><path d="M 739.988867 255.999969 L 739.721679 304.000155 S 739.666016 314 729.666016 314 L 564.083008 314 S 554.083008 314 554.076671 323.999998 L 554.002535 441.000001" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1168463733-3488378134)" mask="url(#d2-1168463733)" /><text x="611.5" y="320" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">はい</text></g><g class="KGFzc2V0cyAtJmd0OyBmZXRjaClbMF0="><path d="M 843 256 L 843 457" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1168463733-348837813