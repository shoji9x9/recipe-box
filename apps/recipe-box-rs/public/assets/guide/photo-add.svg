6667">大きさは Content-Length で決める</tspan></text></g><g class="KHdvcmtlciAtJmd0OyBkMSlbMF0="><path d="M 515 497.5 L 1104 497.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-680104929-3488378134)" mask="url(#d2-680104929)" /><text x="810.5" y="495" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="810.5" dy="0">上限を数えて、行（書き込みの終わっていない印付き）と</tspan><tspan x="810.5" dy="18.5">追加の記録を入れる（batch。1 つのトランザクション）</tspan></text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1106 595.5 L 517 595.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-680104929-3488378134)" mask="url(#d2-680104929)" /><text x="810.5" y="601" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">入れた（上限に達していれば入れない → 409・413・503）</text></g><g class="KHdvcmtlciAtJmd0OyByMilbMF0="><path d="M 515 685.5 L 1388 685.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-680104929-3488378134)" mask="url(#d2-680104929)" /><text x="953" y="691" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">本文をストリームのまま書く（waitUntil で最後まで）</text></g><g class="KHIyIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1390 775.5 L 517 775.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-680104929-3488378134)" mask="url(#d2-680104929)" /><text x="953" y="781" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">書けた（失敗したら D1 の行を消す → 500）</text></g><g class="KHdvcmtlciAtJmd0OyBkMSlbMV0="><path d="M 515 865.5 L 1104 865.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-680104929-3488378134)" mask="url(#d2-680104929)" /><text x="810.5" y="871" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">行の印を外す（画面と API に出す）</text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMV0="><path d="M 1106 955.5 L 517 955.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-680104929-3488378134)" mask="url(#d2-680104929)" /><text x="810.5" y="961" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">外せたかを返す（行が無ければ、Worker が R2 のデータを消す）</text></g><g class="KHdvcmtlciAtJmd0OyBjbGllbnQpWzBd"><path d="M 511 1045.5 L 139 1045.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-680104929-3488378134)" mask="url(#d2-680104929)" /><text x="324" y="1051" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">201（追加した写真）</text></g><mask id="d2-680104929" maskUnits="userSpaceOnUse" x="-5" y="35" width="1464" height="1098">
