font-size:16px"><tspan x="781.5" dy="0">上限を数えて、行と追加の記録を入れる</tspan><tspan x="781.5" dy="18.5">（batch。1 つのトランザクション）</tspan></text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1048 519.5 L 517 519.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3248111338-3488378134)" mask="url(#d2-3248111338)" /><text x="781.5" y="525" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">入れた（上限に達していれば入れない → 409・413・503）</text></g><g class="KHdvcmtlciAtJmd0OyByMilbMF0="><path d="M 515 609.5 L 1330 609.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3248111338-3488378134)" mask="url(#d2-3248111338)" /><text x="924" y="615" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">本文をストリームのまま書く（waitUntil で最後まで）</text></g><g class="KHIyIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1332 699.5 L 517 699.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3248111338-3488378134)" mask="url(#d2-3248111338)" /><text x="924" y="705" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">書けた（失敗したら D1 の行を消す → 500）</text></g><g class="KHdvcmtlciAtJmd0OyBkMSlbMV0="><path d="M 515 789.5 L 1046 789.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3248111338-3488378134)" mask="url(#d2-3248111338)" /><text x="782" y="795" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">行がまだ在るか（レシピが同時に消されていないか）</text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMV0="><path d="M 1048 879.5 L 517 879.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3248111338-3488378134)" mask="url(#d2-3248111338)" /><text x="781.5" y="885" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">在るかを返す（無ければ、Worker が R2 のデータを消す）</text></g><g class="KHdvcmtlciAtJmd0OyBjbGllbnQpWzBd"><path d="M 511 969.5 L 139 969.5" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-3248111338-3488378134)" mask="url(#d2-3248111338)" /><text x="324" y="975" fill="#676C7E" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px">201（追加した写真）</text></g><mask id="d2-3248111338" maskUnits="userSpaceOnUse" x="-5" y="35" width="1406" height="1022">
