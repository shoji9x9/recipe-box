ill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="296.5" y="445" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="296.5" dy="0">canvas で長い辺を 1280 ピクセルに</tspan><tspan x="296.5" dy="18.5">縮めた JPEG を作る</tspan></text></g><g class="KGNsaWVudCAtJmd0OyB3b3JrZXIpWzFd"><path d="M 148.5 555.5 L 583 555.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="367" y="561" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">小さな版（JPEG）と元の写真の幅</text></g><g class="KHdvcmtlciAtJmd0OyB3b3JrZXIpWzBd"><path d="M 589 635.5 L 741 635.5 S 751 635.5 751 645.5 L 751 681 S 751 691 741 691 L 591 691" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="751" y="661" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="751" dy="0">形と大きさを確かめ、メタデータを</tspan><tspan x="751" dy="18.5">0 で埋める（違えば 413・415）</tspan></text></g><g class="KHdvcmtlciAtJmd0OyBkMSlbMF0="><path d="M 589 771 L 1145 771" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="868.5" y="777" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">合計の上限を数えて、小さな版の枠を取る（1 つの文）</text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1147 861 L 591 861" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="868.5" y="867" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">取れた（取れなければ 404・409）</text></g><g class="KHdvcmtlciAtJmd0OyByMilbMF0="><path d="M 589 951 L 1359 951" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="975.5" y="957" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">小さな版を書く</text></g><g class="KHIyIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1361 1041 L 591 1041" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="975.5" y="1047" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">書けた（失敗したら枠を返す → 500）</text></g><g class="KHdvcmtlciAtJmd0OyBkMSlbMV0="><path d="M 589 1131 L 1145 1131" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="868" y="1137" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">幅を入れて、画面に出す</text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMV0="><path d="M 1147 1221 L 591 1221" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="868" y="1227" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">入れたか（写真が消えていれば、R2 のデータを消す → 404）</text></g><g class="KHdvcmtlciAtJmd0OyBjbGllbnQpWzFd"><path d="M 585 1311 L 150.5 1311" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-4024216708-3488378134)" mask="url(#d2-4024216708)" /><text x="366.5" y="1317" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">204</text></g><mask id="d2-4024216708" maskUnits="userSpaceOnUse" x="-5" y="35" width="1435" height="1363">
