e:16px">R2</text></g><g class="KGNsaWVudCAtLSApWzBd"><path d="M 146.5 172 L 146.5 1396" stroke="#6a6a6a" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-118098444)" /></g><g class="KHdvcmtlciAtLSApWzBd"><path d="M 587 172 L 587 1396" stroke="#e00b41" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-118098444)" /></g><g class="KGQxIC0tIClbMF0="><path d="M 1120 172 L 1120 1396" stroke="#2b6cb0" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-118098444)" /></g><g class="KHIyIC0tIClbMF0="><path d="M 1334 172 L 1334 1396" stroke="#2b6cb0" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:12.000000,11.838767;" mask="url(#d2-118098444)" /></g><g class="KGNsaWVudCAtJmd0OyB3b3JrZXIpWzBd"><marker id="mk-d2-118098444-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#6a6a6a" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 148.5 250 L 583 250" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="367" y="256" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">写真のバイト列（すべての写真を 1 枚ずつ）</text></g><g class="KHdvcmtlciAtJmd0OyBjbGllbnQpWzBd"><path d="M 585 340 L 150.5 340" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="366.5" y="346" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">204 と写真の ID（X-Photo-Id）</text></g><g class="KGNsaWVudCAtJmd0OyBjbGllbnQpWzBd"><path d="M 148.5 420 L 349.5 420 S 359.5 420 359.5 430 L 359.5 465.5 S 359.5 475.5 349.5 475.5 L 150.5 475.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="360" y="445" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="360" dy="0">canvas で長い辺を 1280 ピクセルまでに</tspan><tspan x="360" dy="18.5">縮めた JPEG を作る（小さな写真には作らない）</tspan></text></g><g class="KGNsaWVudCAtJmd0OyB3b3JrZXIpWzFd"><path d="M 148.5 555.5 L 583 555.5" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="367" y="561" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">小さな版（JPEG）と元の写真の幅</text></g><g class="KHdvcmtlciAtJmd0OyB3b3JrZXIpWzBd"><path d="M 589 635.5 L 741 635.5 S 751 635.5 751 645.5 L 751 681 S 751 691 741 691 L 591 691" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="751" y="661" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="751" dy="0">形と大きさを確かめ、メタデータを</tspan><tspan x="751" dy="18.5">0 で埋める（違えば 413・415）</tspan></text></g><g class="KHdvcmtlciAtJmd0OyBkMSlbMF0="><path d="M 589 771 L 1116 771" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="853.5" y="777" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">合計の上限を数えて、小さな版の枠を取る（1 つの文）</text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1118 861 L 591 861" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="853.5" y="867" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">取れた（取れなければ 404・409）</text></g><g class="KHdvcmtlciAtJmd0OyByMilbMF0="><path d="M 589 951 L 1330 951" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="960.5" y="957" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">小さな版を書く</text></g><g class="KHIyIC0mZ3Q7IHdvcmtlcilbMF0="><path d="M 1332 1041 L 591 1041" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="960.5" y="1047" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">書けた（失敗したら枠を返す → 500）</text></g><g class="KHdvcmtlciAtJmd0OyBkMSlbMV0="><path d="M 589 1131 L 1116 1131" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="854" y="1137" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">幅を入れて、画面に出す</text></g><g class="KGQxIC0mZ3Q7IHdvcmtlcilbMV0="><path d="M 1118 1229 L 591 1229" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="853.5" y="1227" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="853.5" dy="0">入れたか（写真が消えていれば、R2 のデータを消して</tspan><tspan x="853.5" dy="18.5">枠を返す → 404。D1 が失敗しても同じに片付ける → 500）</tspan></text></g><g class="KHdvcmtlciAtJmd0OyBjbGllbnQpWzFd"><path d="M 585 1327 L 150.5 1327" stroke="#6a6a6a" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-118098444-3488378134)" mask="url(#d2-118098444)" /><text x="366.5" y="1333" fill="#0A0F25" class="text fill-N1" style="text-anchor:middle;font-size:16px">204</text></g><mask id="d2-118098444" maskUnits="userSpaceOnUse" x="-5" y="35" width="1406" height="1379">
