[package]
name = "recipe-box-rs"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
# cdylib: Workers が読み込む wasm を作る。rlib: テストからこのクレートを使えるようにする。
crate-type = ["cdylib", "rlib"]

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = ["json"] }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
tower-service = "0.3.3"
# workers-rs の 0.9.0 は公開から 7 日たっていないので 0.8.7 に固定する。
worker = { version = "=0.8.7", features = ["http", "axum"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
