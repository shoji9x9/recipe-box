[package]
name = "recipe-box-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# cdylib: Workers が読み込む wasm を作る。rlib: テストからこのクレートを使えるようにする。
crate-type = ["cdylib", "rlib"]

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = [
  "form",
  "json",
  # 画面から写真を送るフォーム（multipart/form-data）を読む。
  "multipart",
  "query",
] }
console_error_panic_hook = "0.1.7"
# Workers の waitUntil で動かした処理の結果を、リクエストの側で受け取るのに使う。版は worker が使うものに合わせる。
futures-channel = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tower-service = "0.3.3"
# Web Crypto の乱数を呼ぶのに使う。版は worker が使うものに合わせる。
wasm-bindgen = "0.2.130"
# worker-build（mise.toml）と同じ版に固定して、一緒に上げる（docs/development.md）。
worker = { version = "=0.9.0", features = ["http", "axum", "d1"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
