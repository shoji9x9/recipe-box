[package]
name = "recipe-box-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# cdylib: Workers が読み込む wasm を作る。rlib: テストからこのクレートを使えるようにする。
crate-type = ["cdylib", "rlib"]

[dependencies]
askama = "0.16.1"
axum = { version = "0.8.9", default-features = false, features = [
  "form",
  "json",
  "query",
] }
console_error_panic_hook = "0.1.7"
serde = { version = "1.0.229", features = ["derive"] }
tower-service = "0.3.3"
# Web Crypto の乱数を呼ぶのに使う。版は worker が使うものに合わせる。
wasm-bindgen = "0.2.130"
# workers-rs の 0.9.0 は公開から 7 日たっていないので 0.8.7 に固定する。
worker = { version = "=0.8.7", features = ["http", "axum", "d1"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
