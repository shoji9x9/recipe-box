name = "recipe-box"
main = "build/index.js"
compatibility_date = "2026-11-01"
# <名前>.workers.dev で公開する。
workers_dev = true
# 版ごとのプレビューの URL は使わないので作らない（誰でも開ける URL を増やさない）。
preview_urls = false

[build]
# worker-build は mise で入れる（版は mise.toml で固定する）。
# htmx は pnpm で版を固定して入れ（package.json）、ここで静的アセットの置き場にコピーする。
command = "worker-build --release && mkdir -p public/assets && cp ../../node_modules/htmx.org/dist/htmx.min.js public/assets/htmx.min.js"

# 画面が使う静的なファイル（CSS・htmx）。Worker を起動せずに配られるので、Worker のリクエストの数に入らない。
# パスがファイルに当たらないリクエストだけを Worker が受け取る。
[assets]
directory = "public"

# guide:start bindings
# レシピなどを保存する D1 のデータベース。
# database_id はアカウントごとの値なので書かない。wrangler は database_name で探す。
[[d1_databases]]
binding = "DB"
database_name = "recipe-box"

# 写真を置く R2 のバケット。無ければ deploy.yml が作る。
# 上限（docs/security.md の「費用の対策」）は、書き込む前に D1 で判定する。
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "recipe-box-photos"

# 定期実行。毎日 UTC の 18 時（日本時間の 3 時）に、14 日使われていないワークスペースを消す（src/workspace.rs の delete_unused）。
[triggers]
crons = ["0 18 * * *"]

# 共有のデモのワークスペースの ID は、secret の DEMO_WORKSPACE_ID に置く（ID を知れば API で書き込めるので、公開しない）。
# 無ければ、Cookie の無い人には説明とワークスペースを作るボタンだけを出す。

# ワークスペースを作る回数の制限。1 つの IP アドレスから 60 秒に 10 回まで。
# Cloudflare の拠点ごとに数える、おおよその制限である。
[[ratelimits]]
name = "WORKSPACE_CREATION_LIMITER"
# アカウントの中で重ならない正の整数。
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# 書き込む API（レシピの登録・更新・削除と、写真の追加・削除）の回数の制限。1 つの IP アドレスから 60 秒に 30 回まで。
# ワークスペースを調べる前に断り、D1 の読み書きを連打で増やさせない。おおよその制限である。
[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
# guide:end bindings

# Workers のログ。tail を開いていない間のエラー（src/error.rs の log_error。ID を伏せてから出す）を、後から見られるようにする。
# リクエストの記録（invocation logs）は残さない。API の X-Workspace-Id（ワークスペースの ID）が残るかもしれないためである。
# そのため、リクエストごとの cpuTime は wrangler tail で見る。
[observability]
enabled = true

[observability.logs]
invocation_logs = false
