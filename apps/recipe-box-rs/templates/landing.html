{% extends "base.html" %}
{% block title %}はじめる{% endblock %}
{% block content %}
<section class="panel">
  <h1>レシピ帳をはじめる</h1>
  <p>ログインは要りません。ボタンを押すと、あなた専用のレシピ帳（ワークスペース）を作ります。</p>
  <p>ワークスペースは、14 日使わないと自動で消えます。</p>
  {%- if let Some(message) = error %}
  <p class="error" role="alert">{{ message }}</p>
  {%- endif %}
  <form method="post" action="/workspace">
    <button type="submit" class="primary">はじめる</button>
  </form>
  {% include "switch_form.html" %}
</section>
{% endblock %}
