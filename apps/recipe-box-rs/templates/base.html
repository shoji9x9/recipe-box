<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {#- htmx の設定。CSP で禁じているインラインのスタイルと eval を使わせない。
        エラーの応答（400 など）も画面に出すため、すべての状態コードの本文を入れ替える。
        閲覧の履歴をブラウザの localStorage に残さない（historyCacheSize）。 #}
    <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"historyCacheSize":0,"responseHandling":[{"code":"...","swap":true}]}'>
    <title>{% block title %}{% endblock %} - recipe-box</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/style.css">
    <script src="/assets/htmx.min.js" defer></script>
  </head>
  <body hx-boost="true">
    <header>
      <a class="brand" href="/">recipe-box</a>
      <nav><a href="/workspace">ワークスペース</a></nav>
    </header>
    <main>
      {%- block content %}{% endblock %}
    </main>
  </body>
</html>
