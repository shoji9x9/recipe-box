{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
{% include "demo_notice.html" %}
<h1>{{ heading }}</h1>
{%- if let Some(message) = error %}
<p class="error" role="alert">{{ message }}</p>
{%- endif %}
<form method="post" action="{{ action }}" class="recipe-form">
  <label for="name">料理名（必須・100 文字まで）</label>
  <input id="name" name="name" value="{{ name }}" required maxlength="100" autocomplete="off"{% if error_field == "name" %} aria-invalid="true" autofocus{% endif %}>
  <label for="servings">何人分か（必須・1 から 100）</label>
  <input id="servings" name="servings" type="number" min="1" max="100" step="1" value="{{ servings }}" required autocomplete="off"{% if error_field == "servings" %} aria-invalid="true" autofocus{% endif %}>
  <label for="ingredients">材料（2,000 文字まで。1 行に 1 つ）</label>
  <textarea id="ingredients" name="ingredients" rows="8" maxlength="2000"{% if error_field == "ingredients" %} aria-invalid="true" autofocus{% endif %}>{{ ingredients }}</textarea>
  <label for="steps">手順（5,000 文字まで）</label>
  <textarea id="steps" name="steps" rows="12" maxlength="5000"{% if error_field == "steps" %} aria-invalid="true" autofocus{% endif %}>{{ steps }}</textarea>
  <div class="actions">
    <button type="submit" class="primary">保存する</button>
    <a class="button-link secondary" href="{{ cancel_href }}">やめる</a>
  </div>
</form>
{% endblock %}
