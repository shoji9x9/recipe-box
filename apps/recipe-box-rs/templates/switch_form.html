<form method="post" action="/workspace/switch" class="switch">
  <label for="workspace-id">ほかの端末で作ったワークスペースの ID を使う</label>
  <div class="row">
    <input id="workspace-id" name="id" required maxlength="32" pattern="[0-9a-f]{32}" autocomplete="off" spellcheck="false">
    <button type="submit">使う</button>
  </div>
</form>
