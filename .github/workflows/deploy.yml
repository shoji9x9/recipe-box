name: Deploy

# main に入った変更を Cloudflare Workers の本番へデプロイする。
# Cloudflare の API トークンとアカウント ID は、GitHub Environment「production」の secret に置く。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

# デプロイは途中で止めず、順番に 1 つずつ実行する。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - name: Check Cloudflare credentials
        id: cred
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "Environment「production」に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が無いので、デプロイしない" >>"$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.cred.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        if: steps.cred.outputs.present == 'true'
        with:
          cache: true
      - name: Install Node packages
        if: steps.cred.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Deploy
        if: steps.cred.outputs.present == 'true'
        working-directory: apps/recipe-box-rs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
