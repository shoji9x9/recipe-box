name: Deploy

# main に入った変更を Cloudflare Workers の本番へデプロイする。
# Cloudflare の API トークンとアカウント ID は、GitHub Environment「production」の secret に置く。
# 公開リポジトリの Actions のログは誰でも読めるので、アカウント ID も secret にしてログで伏せ字にする（認証情報ではないが、公開しない）。
# D1 のデータベースの ID も、同じ理由でログで伏せ字にする。
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

# デプロイは途中で止めず、順番に 1 つずつ実行する。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read # コードを読む
    steps:
      - name: Check Cloudflare credentials
        id: cred
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >>"$GITHUB_OUTPUT"
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            message="Environment「production」に secret の CLOUDFLARE_API_TOKEN か CLOUDFLARE_ACCOUNT_ID が無いので、デプロイしない"
            echo "::warning::$message"
            echo "$message" >>"$GITHUB_STEP_SUMMARY"
            # 手で実行したときは、デプロイできなかったことに気付けるよう失敗させる。
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              exit 1
            fi
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.cred.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        if: steps.cred.outputs.present == 'true'
        with:
          cache: true
      - name: Install Node packages
        if: steps.cred.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # D1 のデータベースが無ければ作る（初めてのデプロイのとき）。置き場所はアジア太平洋にする。
      # 作ったときの出力には ID が出るので、失敗したときだけ表示する。
      # 最後に ID を ::add-mask:: に渡し、この後の手順のログ（マイグレーションの出力など）で伏せ字にする。
      - name: Create D1 database if missing
        if: steps.cred.outputs.present == 'true'
        working-directory: apps/recipe-box-rs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 一覧を取れないとき（権限不足やネットワークの失敗）は、作ろうとせずにその場で失敗させる。
        run: |
          pnpm exec wrangler d1 list --json >/tmp/d1-list.json
          if ! jq -e 'any(.[]; .name == "recipe-box")' /tmp/d1-list.json >/dev/null; then
            if ! pnpm exec wrangler d1 create recipe-box --location apac >/tmp/d1-create.log 2>&1; then
              sed -E 's/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/***/g' /tmp/d1-create.log
              exit 1
            fi
            echo "D1 のデータベース recipe-box を作った"
            pnpm exec wrangler d1 list --json >/tmp/d1-list.json
          fi
          database_id=$(jq -r 'first(.[] | select(.name == "recipe-box") | .uuid) // empty' /tmp/d1-list.json)
          if [ -z "$database_id" ]; then
            echo "::error::D1 のデータベース recipe-box の ID を取れない"
            exit 1
          fi
          echo "::add-mask::$database_id"
      # 新しいコードが新しい表を使えるよう、デプロイの前にマイグレーションを当てる。
      # マイグレーションは、古いコードのままでも動くように（列や表を足すだけに）書く。
      - name: Apply migrations to D1
        if: steps.cred.outputs.present == 'true'
        working-directory: apps/recipe-box-rs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy
        if: steps.cred.outputs.present == 'true'
        working-directory: apps/recipe-box-rs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
