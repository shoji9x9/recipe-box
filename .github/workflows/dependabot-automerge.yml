name: Dependabot auto-merge

# Dependabot の PR のうち、1.0 以上の依存の minor と patch の更新だけを、CI が通ったら自動でマージする。
# major・0.x の依存・GitHub Actions の更新は、ラベルを付けて手で確かめる（dependabot-merge スキル）。
# GITHUB_TOKEN でマージした push では、ほかの workflow（deploy.yml の push）が動かない。そのため、自動マージを予約したら、
# マージされるのを待って deploy.yml を workflow_dispatch で起動する（workflow_dispatch はこの制限の例外。
# https://docs.github.com/en/actions/concepts/security/github_token ）。
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  automerge:
    name: Dependabot auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 自動マージを予約する
      pull-requests: write # ラベルを付ける
      issues: write # ラベルを作る
    # 自動マージを予約できたときだけ、下の deploy-after-merge を動かす。
    outputs:
      enabled: ${{ steps.route.outputs.decision == 'automerge' && steps.enable.outcome == 'success' }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Decide routing
        id: route
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          set -euo pipefail
          decision=review
          case "$ECOSYSTEM" in
            github-actions | github_actions)
              echo "GitHub Actions の更新は手で確かめる"
              ;;
            *)
              case "$UPDATE_TYPE" in
                version-update:semver-minor | version-update:semver-patch)
                  all_ge_1="$(printf '%s' "$DEPS_JSON" | jq -r '
                    (length > 0) and all(.[];
                      ((.newVersion // "") | sub("^[^0-9]*"; "") | split(".")[0] | (tonumber? // 0)) >= 1)')"
                  if [ "$all_ge_1" = "true" ]; then
                    decision=automerge
                  else
                    echo "0.x の依存を含むので手で確かめる"
                  fi
                  ;;
                *)
                  echo "major か、種類が分からない更新（$UPDATE_TYPE）なので手で確かめる"
                  ;;
              esac
              ;;
          esac
          echo "decision=$decision" >>"$GITHUB_OUTPUT"
      - name: Enable auto-merge
        id: enable
        if: steps.route.outputs.decision == 'automerge'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
      - name: Label for manual review
        if: steps.route.outputs.decision == 'review' || steps.enable.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "dependabot/needs-review" --repo "$REPO" \
            --description "Dependabot の PR を手で確かめる（major・0.x・GitHub Actions・自動マージの失敗）" \
            --color "D93F0B" --force
          gh pr edit "$PR_URL" --add-label "dependabot/needs-review"

  # 自動マージを予約した PR がマージされたら、本番へデプロイする（冒頭のコメント）。
  # 第三者の action（fetch-metadata）を動かす上の job とは分け、actions: write をこの job にだけ与える。
  # コードを checkout せず、gh で PR の状態を読み、deploy.yml を起動するだけにする。
  deploy-after-merge:
    name: Deploy after auto-merge
    needs: automerge
    if: needs.automerge.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    # CI が終わって自動マージされるのを待つ。
    timeout-minutes: 60
    permissions:
      pull-requests: read # PR がマージされたかを確かめる
      actions: write # deploy.yml を workflow_dispatch で起動する（GITHUB_TOKEN のマージでは push の workflow が動かないため）
    steps:
      - name: Wait for merge and dispatch deploy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 55 分（30 秒 × 110 回）まで待つ。timeout-minutes より短くし、時間切れを warning で知らせる。
          for _ in $(seq 1 110); do
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            case "$state" in
              MERGED)
                gh workflow run deploy.yml --repo "$REPO" --ref main
                echo "マージされたので deploy.yml を起動した"
                exit 0
                ;;
              CLOSED)
                echo "マージされずに閉じられたので、デプロイしない"
                exit 0
                ;;
            esac
            sleep 30
          done
          echo "::warning::55 分待ってもマージされなかったので、デプロイしない（マージされたら Actions の画面から deploy.yml を手で動かす）"
